<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Important Question</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: rgba(0,0,0,0.45);
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      z-index: 1;
    }

    h1 {
      margin-bottom: 20px;
    }

    #status {
      display: none;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      font-size: 18px;
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      position: absolute;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #trueBtn {
      background: #4CAF50;
      color: white;
      left: 30%;
      top: 65%;
    }

    #falseBtn {
      background: #f44336;
      color: white;
      left: 55%;
      top: 65%;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Is LEONEL handsome?</h1>
    <div id="status">🤔 Thinking...</div>
  </div>

  <button id="trueBtn">TRUE</button>
  <button id="falseBtn">FALSE</button>

  <audio id="beep">
    <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg">
  </audio>

  <script>
    const trueBtn = document.getElementById("trueBtn");
    const falseBtn = document.getElementById("falseBtn");
    const statusText = document.getElementById("status");
    const beep = document.getElementById("beep");

    function moveRandom(btn) {
      const maxX = window.innerWidth - btn.offsetWidth;
      const maxY = window.innerHeight - btn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }

    // FALSE: ALWAYS ESCAPES (PC + Mobile)
    falseBtn.addEventListener("mouseenter", () => moveRandom(falseBtn));
    falseBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveRandom(falseBtn);
    });

    // Extra evil: move when finger/mouse gets close
    document.addEventListener("mousemove", (e) => {
      const rect = falseBtn.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 120) {
        moveRandom(falseBtn);
      }
    });

    // TRUE: clickable → fake thinking → sound → rickroll
    trueBtn.addEventListener("click", () => {
      statusText.style.display = "block";
      beep.play();

      setTimeout(() => {
        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
      }, 2500);
    });

    // Try fullscreen (works after interaction on most browsers)
    document.body.addEventListener("click", () => {
      document.documentElement.requestFullscreen?.();
    }, { once: true });
  </script>

</body>
</html>
